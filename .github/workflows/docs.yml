# Builds the Sphinx documentation on every push and pull request, treating
# warnings as errors. Read the Docs builds and hosts the published pages
# (see .readthedocs.yaml); this workflow only checks that they build.
name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            setup.py

      - name: Install ColRadPy and Sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt .

      - name: Build HTML
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - uses: actions/upload-artifact@v6
        with:
          name: html-documentation
          path: docs/build/html
          retention-days: 14
